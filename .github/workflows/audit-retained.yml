name: Read-only exact retained v2.0.2 package audit
on:
  push:
    branches: ['qa/exact-artifacts-85f7139']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          python -m pip install -r requirements-build-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libgl1 libdbus-1-3 libfontconfig1 libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 xvfb xauth
      - name: Verify exact retained Windows and Linux bytes and inventories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_retained_release.py
      - name: Install declared host library equivalents
        run: python scripts/linux_dependencies.py retained-candidate/Linux/File-Renamer/LINUX-SYSTEM-DEPENDENCIES.json
      - name: Check the same retained Linux packages on Ubuntu 24.04
        run: |
          chmod +x retained-candidate/File-Renamer-x86_64.AppImage
          python scripts/smoke_bundle.py retained-candidate/Linux/File-Renamer/File-Renamer
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/smoke_bundle.py retained-candidate/File-Renamer-x86_64.AppImage
          FILE_RENAMER_SMOKE_PLATFORM=xcb APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python scripts/smoke_bundle.py retained-candidate/File-Renamer-x86_64.AppImage
          echo 'Exact retained85f7139 packages passed read-only inventory/privacy/checksum review and Ubuntu24 offscreen/X11 GUI and actual preview-worker checks. No release asset was changed or published.' >> "$GITHUB_STEP_SUMMARY"
