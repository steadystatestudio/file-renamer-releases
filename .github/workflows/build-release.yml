name: Release preparation
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact source commit on main (40 hex characters)
        required: true
        type: string
      tag:
        description: New tag matching the application version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: candidate-${{ inputs.tag }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONUTF8: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  QT_QPA_PLATFORM: offscreen
  REVIEWED_COMMIT: ${{ inputs.commit }}
  RELEASE_TAG: ${{ inputs.tag }}
jobs:
  prepare:
    if: (github.repository == 'steadystatestudio/file-renamer-releases' || github.repository == 'steadystatestudio/file-renamer-builds') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.candidate.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_candidate.py init
  build:
    needs: prepare
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
          - os: ubuntu-22.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Preserve Git blob bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/setup_linux_build.sh --system-only
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-build-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python scripts/build_rule_tools.py
      - run: python -m pytest -q --basetemp="${{ runner.temp }}/fr-${{ github.run_id }}-${{ github.run_attempt }}" --junitxml=artifacts/tests.xml
      - run: python scripts/render_preview.py
      - run: python scripts/render_rules.py
      - run: python scripts/build.py
      - name: Windows packaged app check
        if: runner.os == 'Windows'
        run: python scripts/smoke_bundle.py dist/File-Renamer/File-Renamer.exe artifacts/smoke-windows
      - name: Linux packaged app checks
        if: runner.os == 'Linux'
        run: |
          python scripts/smoke_bundle.py dist/File-Renamer/File-Renamer artifacts/smoke-bundle
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/smoke_bundle.py dist/File-Renamer-x86_64.AppImage artifacts/smoke-appimage
          FILE_RENAMER_SMOKE_PLATFORM=xcb APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python scripts/smoke_bundle.py dist/File-Renamer-x86_64.AppImage artifacts/smoke-x11
      - name: Retain successful native packages in draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_candidate.py stage --platform '${{ matrix.platform }}'
  sources:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/fetch_release_sources.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_candidate.py stage --platform Sources
  compatibility:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install independent verification and desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libegl1 libopengl0 libgl1 libdbus-1-3 libfontconfig1 libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Download and verify exact retained Ubuntu 22.04 packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_candidate.py verify-linux
      - name: Exercise retained packages on Ubuntu 24.04
        env:
          PYTHONPATH: src
        run: |
          python scripts/linux_dependencies.py candidate/File-Renamer/LINUX-SYSTEM-DEPENDENCIES.json
          chmod +x candidate/File-Renamer-x86_64.AppImage
          python scripts/smoke_bundle.py candidate/File-Renamer/File-Renamer artifacts/smoke-ubuntu24-bundle
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/smoke_bundle.py candidate/File-Renamer-x86_64.AppImage artifacts/smoke-ubuntu24-appimage
          FILE_RENAMER_SMOKE_PLATFORM=xcb APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python scripts/smoke_bundle.py candidate/File-Renamer-x86_64.AppImage artifacts/smoke-ubuntu24-x11
      - name: Retain compatibility evidence tied to the tested Linux bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_candidate.py stage --platform Ubuntu24
  verify:
    needs: [prepare, build, sources, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_candidate.py finalize
