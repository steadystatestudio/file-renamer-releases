name: Stage private release candidate (never publish)
on:
  push:
    branches: ['release/public-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONUTF8: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  QT_QPA_PLATFORM: offscreen
jobs:
  prepare:
    if: github.repository == 'steadystatestudio/file-renamer-releases' && startsWith(github.ref, 'refs/heads/release/public-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.candidate.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_candidate.py init
  build:
    needs: prepare
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
          - os: ubuntu-22.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/setup_linux_build.sh --system-only
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-build-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python scripts/build_rule_tools.py
      - run: python -m pytest -q --junitxml=artifacts/tests.xml
      - run: python scripts/render_preview.py
      - run: python scripts/render_rules.py
      - run: python scripts/build.py
      - name: Windows packaged app check
        if: runner.os == 'Windows'
        run: python scripts/smoke_bundle.py dist/File-Renamer/File-Renamer.exe
      - name: Linux packaged app checks
        if: runner.os == 'Linux'
        run: |
          python scripts/smoke_bundle.py dist/File-Renamer/File-Renamer
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/smoke_bundle.py dist/File-Renamer-x86_64.AppImage
          FILE_RENAMER_SMOKE_PLATFORM=xcb APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python scripts/smoke_bundle.py dist/File-Renamer-x86_64.AppImage
      - name: Retain successful native packages in private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_candidate.py stage --platform '${{ matrix.platform }}'
  sources:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/fetch_release_sources.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_candidate.py stage --platform Sources
  verify:
    needs: [prepare, build, sources]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_candidate.py finalize
