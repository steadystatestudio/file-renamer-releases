name: Build and test
on:
  push:
    branches-ignore: ["release/public-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Release preparation/manual/PR checks still run in the private build repo.
    if: github.event_name != 'push' || github.repository != 'steadystatestudio/file-renamer-builds' || github.event.repository.private != true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Preserve Git blob bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/setup_linux_build.sh --system-only
      - run: python -m pip install -c packaging/build-constraints.txt ".[dev,packaging]"
      - run: python -m ruff check src tests scripts
      - run: python scripts/build_rule_tools.py
      - run: python -m pytest -q --basetemp="${{ runner.temp }}/fr-${{ github.run_id }}-${{ github.run_attempt }}" --junitxml=artifacts/tests.xml
      - run: python scripts/render_preview.py
      - run: python scripts/render_rules.py
      - name: Acquire Linux packaging tool
        if: runner.os == 'Linux'
        run: |
          python scripts/fetch_appimagetool.py
          echo "APPIMAGETOOL=$PWD/build/tools/appimagetool" >> "$GITHUB_ENV"
      - run: python scripts/build.py
      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        run: python scripts/smoke_bundle.py dist/File-Renamer/File-Renamer.exe artifacts/smoke-windows
      - name: Smoke test Linux executable
        if: runner.os == 'Linux'
        run: |
          python scripts/smoke_bundle.py dist/File-Renamer/File-Renamer artifacts/smoke-bundle
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/smoke_bundle.py dist/File-Renamer-x86_64.AppImage artifacts/smoke-appimage
          FILE_RENAMER_SMOKE_PLATFORM=xcb APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python scripts/smoke_bundle.py dist/File-Renamer-x86_64.AppImage artifacts/smoke-x11
      - name: Preserve exact review source
        run: git archive --format=zip --output=artifacts/review-source.zip HEAD
      - name: Retain private review packages and evidence
        if: github.repository == 'steadystatestudio/file-renamer-builds' && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: File-Renamer-review-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/BUILD-INFO.json
            dist/SHA256SUMS
            artifacts/tests.xml
            artifacts/review-source.zip
            artifacts/smoke-*/result.json
            artifacts/smoke-*/ui.png
            artifacts/smoke-*/ui-preview.png
