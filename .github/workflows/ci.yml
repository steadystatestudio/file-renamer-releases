name: Test and package
on:
  push:
    branches-ignore: ["release/public-*", "qa/*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/setup_linux_build.sh --system-only
      - run: python -m pip install -c packaging/build-constraints.txt ".[dev,packaging]"
      - run: python -m ruff check src tests scripts
      - run: python scripts/build_rule_tools.py
      - run: python -m pytest -q --junitxml=artifacts/tests.xml
      - run: python scripts/render_preview.py
      - run: python scripts/render_rules.py
      - name: Acquire Linux packaging tool
        if: runner.os == 'Linux'
        run: |
          python scripts/fetch_appimagetool.py
          echo "APPIMAGETOOL=$PWD/build/tools/appimagetool" >> "$GITHUB_ENV"
      - run: python scripts/build.py
      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        run: python scripts/smoke_bundle.py dist/File-Renamer/File-Renamer.exe
      - name: Smoke test Linux executable
        if: runner.os == 'Linux'
        run: |
          python scripts/smoke_bundle.py dist/File-Renamer/File-Renamer
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/smoke_bundle.py dist/File-Renamer-x86_64.AppImage
          FILE_RENAMER_SMOKE_PLATFORM=xcb APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python scripts/smoke_bundle.py dist/File-Renamer-x86_64.AppImage
